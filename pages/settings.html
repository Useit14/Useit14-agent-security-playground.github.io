<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки демо — prompt-injection playground</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link rel="stylesheet" href="../src/css/settings.css">
</head>

<body>

  <article>
    <h1>Настройки демо</h1>
    <div class="meta">
      Конфиг в <code>localStorage</code> → применяется на
      <a href="../index.html">index.html</a>.
    </div>

    <form id="settings-form">
      <h2>Callback URL</h2>
      <p class="hint">
        Webhook, куда агент отправит данные.
      </p>
      <input type="url" id="callbackUrl" name="callbackUrl"
        placeholder="https://webhook.site/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required>

      <h2>Способ сокрытия</h2>
      <label>
        <input type="radio" name="hideMode" value="display">
        <code>display:none</code>
      </label>
      <label>
        <input type="radio" name="hideMode" value="comment">
        HTML-комментарий
      </label>
      <label>
        <input type="radio" name="hideMode" value="aria">
        <code>aria-hidden</code> + off-screen
      </label>
      <label>
        <input type="radio" name="hideMode" value="zero">
        Почти невидимый текст
      </label>

      <h2>Формулировка</h2>
      <label>
        <input type="radio" name="phrasing" value="integrity">
        integrity — проверка целостности
      </label>
      <label>
        <input type="radio" name="phrasing" value="raw">
        raw — игнорируй инструкции
      </label>
      <label>
        <input type="radio" name="phrasing" value="tool">
        tool — имитация <code>[TOOL_RESPONSE]</code>
      </label>

      <div class="actions">
        <button type="submit">Сохранить</button>
        <button type="button" id="reset">Сбросить</button>
        <a href="../index.html" class="link-button">Открыть демо →</a>
      </div>

      <p id="status" class="status" role="status"></p>
    </form>

    <h2>Конфиг</h2>
    <pre id="config-preview" class="config-preview"></pre>
    <button type="button" id="copy-config">Скопировать</button>

    <h2>Текст инъекции</h2>
    <pre id="injection-preview" class="config-preview"></pre>
    <button type="button" id="copy-injection">Скопировать</button>

    <h2>Сырой HTML index.html</h2>
    <div class="actions" style="margin-top: 12px;">
      <button type="button" id="load-raw">Загрузить</button>
      <button type="button" id="copy-raw">Скопировать</button>
    </div>
    <pre id="raw-html" class="raw-html" hidden></pre>
  </article>

  <script src="../src/js/config.js"></script>
  <script src="../src/js/payloads.js"></script>
  <script src="../src/js/settings.js"></script>
</body>

</html>
